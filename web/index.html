<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Personal Flutter portfolio app showcasing my projects and experience.">

  <meta property="og:title" content="Ziad Elgaraihe Portfolio">
  <meta property="og:description" content="Flutter Developer Portfolio">
  <meta property="og:image" content="assets/images/logo.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Ziad Elgaraihe | Flutter Dev</title>
  <link rel="manifest" href="manifest.json">
</head>

<body style="margin: 0; background-color: #010B1A;">
    <div id="loading">
      <img src="icons/Icon-512.png" alt="Loading..." />
    </div>

    <style>
      #loading {
        position: fixed;
        inset: 0;
        background: #010B1A;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.5s ease;
        z-index: 9999;
      }

      #loading img {
        width: 120px;
        height: 120px;
        animation: pulse 1.5s infinite ease-in-out;
      }

      @keyframes pulse {
        0% {
          transform: scale(0.95);
          opacity: 0.8;
        }

        50% {
          transform: scale(1);
          opacity: 1;
        }

        100% {
          transform: scale(0.95);
          opacity: 0.8;
        }
      }
    </style>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
